<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <defs>
    <linearGradient id="desk3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FDFBF5"/>
      <stop offset="100%" stop-color="#EEF3FC"/>
    </linearGradient>
    <linearGradient id="gold3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F2D97D"/>
      <stop offset="100%" stop-color="#C99F24"/>
    </linearGradient>
  </defs>
  <rect width="600" height="600" fill="url(#desk3)"/>
  <!-- Open Notebook -->
  <g transform="translate(80, 110)">
    <rect x="0" y="0" width="330" height="380" rx="18" fill="#FFFFFF" stroke="#032B91" stroke-opacity="0.16" stroke-width="3"/>
    <line x1="36" y1="0" x2="36" y2="380" stroke="#D4AF37" stroke-opacity="0.45" stroke-width="2"/>
    <!-- Chemical formula sketches -->
    <g transform="translate(82, 72)" stroke="#032B91" fill="none" stroke-width="2.6">
      <polygon points="48,0 90,24 90,72 48,96 6,72 6,24"/>
      <circle cx="48" cy="48" r="24" stroke="#1488DB"/>
      <line x1="90" y1="24" x2="132" y2="0"/>
      <line x1="132" y1="0" x2="174" y2="24"/>
      <circle cx="174" cy="24" r="6" fill="#D4AF37" stroke="none"/>
      <line x1="90" y1="72" x2="132" y2="96"/>
    </g>
    <!-- Notes lines -->
    <g stroke="#032B91" stroke-opacity="0.18" stroke-width="4" stroke-linecap="round">
      <line x1="66" y1="215" x2="285" y2="215"/>
      <line x1="66" y1="245" x2="250" y2="245"/>
      <line x1="66" y1="275" x2="270" y2="275"/>
      <line x1="66" y1="305" x2="210" y2="305" stroke="#1488DB" stroke-opacity="0.45"/>
    </g>
  </g>
  <!-- Coffee Cup -->
  <g transform="translate(465, 225)">
    <circle cx="0" cy="0" r="64" fill="#FFFFFF" stroke="#032B91" stroke-opacity="0.14" stroke-width="3"/>
    <circle cx="0" cy="0" r="46" fill="#5A3921"/>
    <circle cx="-12" cy="-12" r="14" fill="#8C6239" opacity="0.55"/>
    <path d="M58,-12 L82,-12 C88,-12 88,12 82,12 L58,12" fill="none" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round"/>
  </g>
  <!-- Brass Pen -->
  <g transform="translate(455, 360) rotate(-32)">
    <rect x="-8" y="0" width="16" height="150" rx="8" fill="url(#gold3)"/>
    <polygon points="-8,150 8,150 0,172" fill="#032B91"/>
  </g>
  <text x="44" y="542" font-family="Georgia, serif" font-size="24" font-weight="600" fill="#032B91">Graduation Thesis</text>
  <text x="44" y="570" font-family="sans-serif" font-size="13" letter-spacing="2.5" fill="#52617E">ĐỒ ÁN TỐT NGHIỆP · KỸ THUẬT HÓA HỌC</text>
</svg>
