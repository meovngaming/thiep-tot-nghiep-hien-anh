<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 740" width="600" height="740">
  <defs>
    <linearGradient id="bg4" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#021A58"/>
      <stop offset="60%" stop-color="#032B91"/>
      <stop offset="100%" stop-color="#0D4BC2"/>
    </linearGradient>
    <linearGradient id="gold4" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FAEA9E"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#A67E14"/>
    </linearGradient>
  </defs>
  <rect width="600" height="740" fill="url(#bg4)"/>
  <!-- Filigree border -->
  <rect x="26" y="26" width="548" height="688" rx="22" fill="none" stroke="url(#gold4)" stroke-opacity="0.45" stroke-width="2"/>
  <!-- Subtle molecular halo -->
  <circle cx="300" cy="315" r="175" fill="none" stroke="#FFFFFF" stroke-opacity="0.09" stroke-width="1.5" stroke-dasharray="6 8"/>
  <polygon points="300,125 464,220 464,410 300,505 136,410 136,220" fill="none" stroke="url(#gold4)" stroke-opacity="0.22" stroke-width="1.5"/>
  <!-- Mortarboard Cap -->
  <g transform="translate(300, 300)">
    <polygon points="0,-105 190,-22 0,62 -190,-22" fill="#0B38A8" stroke="url(#gold4)" stroke-width="3.5" stroke-linejoin="round"/>
    <path d="M-110,14 L-110,88 C-110,120 110,120 110,88 L110,14 L0,62 Z" fill="#05216E" stroke="url(#gold4)" stroke-width="2.5"/>
    <!-- Gold Tassel -->
    <circle cx="0" cy="-22" r="9" fill="url(#gold4)"/>
    <path d="M0,-22 Q115,-10 140,86" fill="none" stroke="url(#gold4)" stroke-width="5" stroke-linecap="round"/>
    <ellipse cx="142" cy="112" rx="14" ry="26" fill="url(#gold4)"/>
  </g>
  <!-- Rolled Diploma -->
  <g transform="translate(175, 470)">
    <rect x="0" y="0" width="250" height="44" rx="22" fill="#FFFFFF"/>
    <rect x="108" y="-3" width="34" height="50" rx="6" fill="url(#gold4)"/>
    <path d="M116,46 L104,76 L124,66 L138,78 L134,46 Z" fill="#1488DB"/>
  </g>
  <text x="300" y="625" text-anchor="middle" font-family="Georgia, serif" font-size="30" font-weight="600" fill="#FFFFFF">Class of 2026</text>
  <text x="300" y="660" text-anchor="middle" font-family="sans-serif" font-size="13" letter-spacing="3.5" fill="#F3E2A2">TÂN KỸ SƯ KỸ THUẬT HÓA HỌC</text>
</svg>
