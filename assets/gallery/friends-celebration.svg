  <!-- Celebratory Silhouette Wave -->
  <path d="M0,370 Q150,320 300,355 T600,340 L600,460 L0,460 Z" fill="#032B91" opacity="0.92"/>
  <text x="42" y="408" font-family="Georgia, serif" font-size="25" font-weight="600" fill="#FFFFFF">Thanh Xuân Bách Khoa</text>
